name: Azure Deployment

on:
  push:
    branches: [main, feature/azure-cicd-test]
  workflow_dispatch:

env:
  AZURE_ACR_NAME: ${{ vars.AZURE_ACR_NAME }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_RESOURCE_GROUP }}

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure CLI ログイン
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Docker ログイン (ACR)
        run: |
          az acr login --name ${{ env.AZURE_ACR_NAME }}

      - name: Python環境のセットアップ
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Python依存関係のインストール
        run: |
          python -m pip install --upgrade pip
          pip install requests python-dotenv

      - name: 環境変数ファイルの準備
        run: |
          # .env.azureファイルの作成
          cat > .env.azure << EOF
          AZURE_RESOURCE_GROUP=${{ vars.AZURE_RESOURCE_GROUP }}
          AZURE_LOCATION=${{ vars.AZURE_LOCATION }}
          AZURE_ACR_NAME=${{ vars.AZURE_ACR_NAME }}
          AZURE_CONTAINER_ENV=${{ vars.AZURE_CONTAINER_ENV }}
          AZURE_WORKSPACE_NAME=${{ vars.AZURE_WORKSPACE_NAME }}
          AZURE_BLOB_STORAGE_ACCOUNT_NAME=${{ vars.AZURE_BLOB_STORAGE_ACCOUNT_NAME }}
          AZURE_BLOB_STORAGE_CONTAINER_NAME=${{ vars.AZURE_BLOB_STORAGE_CONTAINER_NAME }}
          EOF

          # .envファイルの作成
          cat > .env << EOF
          PUBLIC_API_KEY=${{ secrets.PUBLIC_API_KEY }}
          ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}
          BASIC_AUTH_USERNAME=${{ vars.BASIC_AUTH_USERNAME }}
          BASIC_AUTH_PASSWORD=${{ secrets.BASIC_AUTH_PASSWORD }}
          OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}
          API_BASEPATH=${{ vars.API_BASEPATH }}
          CLIENT_STATIC_BUILD_BASEPATH=${{ vars.CLIENT_STATIC_BUILD_BASEPATH }}
          ENVIRONMENT=${{ vars.ENVIRONMENT }}
          NEXT_PUBLIC_API_BASEPATH=${{ vars.NEXT_PUBLIC_API_BASEPATH }}
          NEXT_PUBLIC_CLIENT_BASEPATH=${{ vars.NEXT_PUBLIC_CLIENT_BASEPATH }}
          NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL }}
          REVALIDATE_URL=${{ vars.REVALIDATE_URL }}
          STORAGE_TYPE=${{ vars.STORAGE_TYPE }}
          USE_AZURE=${{ vars.USE_AZURE }}
          WITH_GPU=${{ vars.WITH_GPU }}
          REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}
          EOF

      - name: Azure環境の更新デプロイ（最適化版）
        run: |
          # 既存のコンテナからドメイン情報を事前取得
          echo "=== 既存環境からドメイン情報を取得 ==="
          API_DOMAIN=$(az containerapp show --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          CLIENT_DOMAIN=$(az containerapp show --name client --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          CLIENT_ADMIN_DOMAIN=$(az containerapp show --name client-admin --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          CLIENT_STATIC_BUILD_DOMAIN=$(az containerapp show --name client-static-build --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)

          echo "取得したドメイン情報:"
          echo "API Domain: $API_DOMAIN"
          echo "Client Domain: $CLIENT_DOMAIN"
          echo "Admin Domain: $CLIENT_ADMIN_DOMAIN"
          echo "Static Build Domain: $CLIENT_STATIC_BUILD_DOMAIN"

          # レポートのバックアップを取得
          echo "=== レポートのバックアップを取得 ==="
          cd $(pwd) && python3 scripts/fetch_reports.py --api-url https://$API_DOMAIN || echo "レポートバックアップ失敗（継続）"

          # 正しい環境変数で全イメージをビルド
          echo "=== 正しい環境変数で全イメージをビルド ==="

          # APIコンテナ（サーバーサイドなので環境変数はランタイムで設定）
          echo ">>> APIコンテナをビルド中..."
          docker build --platform linux/amd64 -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/api:latest ./server

          # clientコンテナ（Next.jsなのでビルド時に環境変数を埋め込み）
          echo ">>> clientコンテナを正しい環境変数でビルド中..."
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_BASEPATH="https://${API_DOMAIN}" \
            --build-arg NEXT_PUBLIC_PUBLIC_API_KEY="${{ secrets.PUBLIC_API_KEY }}" \
            --build-arg NEXT_PUBLIC_SITE_URL="${{ vars.NEXT_PUBLIC_SITE_URL }}" \
            --build-arg API_BASEPATH="https://${API_DOMAIN}" \
            -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/client:latest ./client

          # client-adminコンテナ（Next.jsなのでビルド時に環境変数を埋め込み）
          echo ">>> client-adminコンテナを正しい環境変数でビルド中..."
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_CLIENT_BASEPATH="https://${CLIENT_DOMAIN}" \
            --build-arg NEXT_PUBLIC_ADMIN_API_KEY="${{ secrets.ADMIN_API_KEY }}" \
            --build-arg NEXT_PUBLIC_API_BASEPATH="https://${API_DOMAIN}" \
            --build-arg CLIENT_STATIC_BUILD_BASEPATH="https://${CLIENT_STATIC_BUILD_DOMAIN}" \
            --build-arg BASIC_AUTH_USERNAME="${{ vars.BASIC_AUTH_USERNAME }}" \
            --build-arg BASIC_AUTH_PASSWORD="${{ secrets.BASIC_AUTH_PASSWORD }}" \
            --build-arg API_BASEPATH="https://${API_DOMAIN}" \
            -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-admin:latest ./client-admin

          # client-static-buildコンテナ（Next.jsなのでビルド時に環境変数を埋め込み）
          echo ">>> client-static-buildコンテナをビルド中..."
          docker build --platform linux/amd64 \
            --build-arg NEXT_PUBLIC_API_BASEPATH="https://${API_DOMAIN}" \
            --build-arg NEXT_PUBLIC_PUBLIC_API_KEY="${{ secrets.PUBLIC_API_KEY }}" \
            --build-arg API_BASEPATH="https://${API_DOMAIN}" \
            -f ./client-static-build/Dockerfile \
            -t ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-static-build:latest .

          # イメージをプッシュ
          echo "=== 全イメージをプッシュ ==="
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/api:latest
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/client:latest
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-admin:latest
          docker push ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-static-build:latest

          # ヘルスプローブとポリシーの適用
          echo "=== ヘルスプローブとポリシーの適用 ==="
          make azure-apply-policies || echo "ポリシー適用失敗（継続）"

      - name: APIコンテナの環境変数設定とイメージ更新
        run: |
          # ドメイン情報を再取得（APIコンテナのランタイム環境変数用）
          API_DOMAIN=$(az containerapp show --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          CLIENT_DOMAIN=$(az containerapp show --name client --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)

          # 全コンテナのイメージを新しいバージョンに更新
          echo "=== 新しいイメージでコンテナを更新 ==="
          az containerapp update --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_ACR_NAME }}.azurecr.io/api:latest &
          az containerapp update --name client --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_ACR_NAME }}.azurecr.io/client:latest &
          az containerapp update --name client-admin --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-admin:latest &
          az containerapp update --name client-static-build --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --image ${{ env.AZURE_ACR_NAME }}.azurecr.io/client-static-build:latest &
          wait

          # APIコンテナのみランタイム環境変数設定（サーバーサイドなので有効）
          echo "=== APIコンテナの環境変数を設定 ==="
          az containerapp update --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --set-env-vars \
              "OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY }}" \
              "PUBLIC_API_KEY=${{ secrets.PUBLIC_API_KEY }}" \
              "ADMIN_API_KEY=${{ secrets.ADMIN_API_KEY }}" \
              "LOG_LEVEL=info" \
              "AZURE_BLOB_STORAGE_ACCOUNT_NAME=${{ vars.AZURE_BLOB_STORAGE_ACCOUNT_NAME }}" \
              "AZURE_BLOB_STORAGE_CONTAINER_NAME=${{ vars.AZURE_BLOB_STORAGE_CONTAINER_NAME }}" \
              "STORAGE_TYPE=azure_blob" \
              "REVALIDATE_URL=https://${CLIENT_DOMAIN}/api/revalidate" \
              "REVALIDATE_SECRET=${{ secrets.REVALIDATE_SECRET }}" \
              "ENVIRONMENT=${{ vars.ENVIRONMENT }}"

          echo "=== デプロイ完了 ==="
          echo "注意: client/client-admin/client-static-buildは Next.js なので、環境変数はビルド時に埋め込み済み"

      - name: デプロイ後の状態確認
        run: |
          echo "=== デプロイ後の状態確認 ==="
          
          # 少し待ってからステータス確認
          echo ">>> 30秒待機してからステータス確認..."
          sleep 30
          
          # コンテナアプリの状態確認
          echo ">>> APIコンテナの状態:"
          az containerapp show --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "properties.{provisioningState:provisioningState,runningState:runningState}" -o table
          
          echo ">>> APIコンテナのレプリカ状態:"
          az containerapp replica list --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --query "[].{name:name,runningState:properties.runningState,createdTime:properties.createdTime}" -o table || echo "レプリカ情報取得失敗"
          
          # APIコンテナのログを取得（最新50行）
          echo ">>> APIコンテナの最新ログ:"
          az containerapp logs show --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} \
            --tail 50 || echo "ログ取得失敗"
          
          # ヘルスチェック確認
          echo ">>> APIヘルスチェック確認..."
          API_DOMAIN=$(az containerapp show --name api --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query properties.configuration.ingress.fqdn -o tsv)
          if [ ! -z "$API_DOMAIN" ]; then
            echo "APIドメイン: https://$API_DOMAIN"
            curl -f "https://$API_DOMAIN/" --max-time 30 || echo "ヘルスチェック失敗"
            curl -f "https://$API_DOMAIN/debug" --max-time 30 || echo "デバッグエンドポイント失敗"
          else
            echo "APIドメインが取得できませんでした"
          fi
