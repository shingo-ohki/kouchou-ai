properties:
  template:
    containers:
      - name: api
        image: {{AZURE_ACR_NAME}}.azurecr.io/api:latest
        probes:
          - type: startup
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 120
            periodSeconds: 15
            timeoutSeconds: 15
            failureThreshold: 20
            successThreshold: 1
          - type: liveness
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 60
            periodSeconds: 60
            timeoutSeconds: 10
            failureThreshold: 5
            successThreshold: 1
    scale:
      minReplicas: 1
      maxReplicas: 1