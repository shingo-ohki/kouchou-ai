properties:
  template:
    containers:
      - name: api
        image: {{AZURE_ACR_NAME}}.azurecr.io/api:latest
        probes:
          - type: startup
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 10
            successThreshold: 1
    scale:
      minReplicas: 1
      maxReplicas: 1