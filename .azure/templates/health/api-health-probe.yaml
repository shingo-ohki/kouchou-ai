properties:
  template:
    containers:
      - name: api
        image: {{AZURE_ACR_NAME}}.azurecr.io/api:latest
        probes:
          - type: startup
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 10
            failureThreshold: 30
            successThreshold: 1
          - type: liveness
            httpGet:
              path: /
              port: 8000
              scheme: HTTP
            initialDelaySeconds: 45
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
            successThreshold: 1
    scale:
      minReplicas: 1
      maxReplicas: 1